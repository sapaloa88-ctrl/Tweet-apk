<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fake Tweet Pro - Guardar Offline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6; margin: 0; padding: 0;
    }
    [contenteditable] { outline: none; padding: 2px 4px; margin: -2px -4px; line-height: 1.3; display: inline-block; }
    .tweet-card-outer { background: white; width: 100%; max-width: 550px; border: 1px solid #e5e7eb; }
    .tweet-container { padding: 24px; }
    .verified-badge { color: #1d9bf0; display: inline-flex; align-items: center; margin-left: 4px; }
    #generated-image-container img {
      max-width: 100%; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 1px solid #e5e7eb;
    }
    .avatar-wrapper { width: 48px; height: 48px; flex-shrink: 0; cursor: pointer; position: relative; }
    .no-export { user-select: none; }
  </style>
</head>
<body class="flex flex-col items-center py-10 px-4">

  <!-- Painel de Controle -->
  <div class="mb-8 flex flex-wrap justify-center items-center gap-4 no-export">
    <button onclick="toggleVerified()" class="px-5 py-2.5 bg-white border border-gray-200 rounded-full text-sm font-semibold shadow-sm">
      <span id="verified-toggle-text">Adicionar Selo</span>
    </button>
    <button onclick="document.getElementById('avatar-input').click()" class="px-5 py-2.5 bg-black text-white rounded-full text-sm font-bold shadow-md">
      Trocar Foto
    </button>
  </div>

  <!-- Cartão do Tweet -->
  <div id="tweet-card" class="tweet-card-outer">
    <div class="tweet-container">
      <div class="flex items-start gap-3">
        <div class="avatar-wrapper" onclick="document.getElementById('avatar-input').click()">
          <img id="avatar-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e5e7eb'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" class="w-full h-full rounded-full object-cover bg-gray-100">
          <input type="file" id="avatar-input" class="hidden" accept="image/*" onchange="handleImageUpload(event)">
        </div>
        <div class="flex-1 min-w-0" style="padding-top: 2px;">
          <div class="flex items-center mb-0.5">
            <span id="display-name" contenteditable="true" spellcheck="false" class="font-bold text-[15px] text-black">Áurio Byus</span>
            <span id="verified-icon" class="verified-badge hidden">
              <svg viewBox="0 0 22 22" class="w-[18px] h-[18px]" fill="currentColor"><path d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.44 1.246-.354.54-.551 1.17-.57 1.816.019.646.216 1.275.57 1.816.354.54.852.972 1.438 1.246-.223.607-.27 1.264-.14 1.897.131.634.437-1.218.882 1.687.47.445-1.053.75 1.687.882.633.13 1.29.083 1.897-.14.273.587.704 1.086 1.245 1.44s1.167.554 1.813.57c.646-.017-1.273.213-1.813-.568s.969-.854 1.24-1.439c.608.223 1.267.272 1.902.14.635-.13 1.22-.436 1.69-.882.445-.47.749-1.055.878-1.688.13-.633.08-1.29-.144-1.896.587-.274 1.087-.705 1.44-1.246.354-.54.551-1.17.57-1.816zM9.667 14.857l-3.011-3.011 1.104-1.105 1.907 1.907 4.256-4.256 1.105 1.105-5.361 5.36z"></path></svg>
            </span>
          </div>
          <div class="text-[#536471] text-[15px] mb-3">
            @<span id="username" contenteditable="true" spellcheck="false">auriobyus</span>
          </div>
          <div id="tweet-text" contenteditable="true" spellcheck="false" class="text-black text-[23px] leading-[1.3] break-words">Deus é fiel</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Botão 1: Gerar -->
  <div class="mt-8 no-export w-full max-w-[320px]">
    <button id="btn-generate" onclick="generatePNG()" class="w-full py-4 bg-black text-white rounded-full font-bold text-base shadow-lg active:scale-95 transition">
      1. GERAR IMAGEM
    </button>
  </div>

  <!-- Área de Resultado -->
  <div id="generated-image-container" class="mt-8 w-full max-w-[550px] flex flex-col items-center"></div>

  <!-- Botão 2: Guardar (Corrigido para evitar o erro) -->
  <div id="save-area" class="mt-6 no-export w-full max-w-[320px] hidden">
    <button onclick="saveDirect()" class="w-full py-4 bg-green-600 text-white rounded-full font-bold text-base shadow-xl active:scale-95 transition flex items-center justify-center gap-3">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      2. GUARDAR NA GALERIA
    </button>
    <p id="status-msg" class="text-[10px] text-center mt-3 text-gray-500 font-medium"></p>
  </div>

  <script>
    let isVerified = false;
    let lastImgData = null;
    let lastBlob = null;

    function toggleVerified() {
      isVerified = !isVerified;
      document.getElementById('verified-icon').classList.toggle('hidden', !isVerified);
      document.getElementById('verified-toggle-text').innerText = isVerified ? 'Remover Selo' : 'Adicionar Selo';
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => document.getElementById('avatar-img').src = e.target.result;
        reader.readAsDataURL(file);
      }
    }

    async function generatePNG() {
      if (document.activeElement) document.activeElement.blur();
      const container = document.getElementById('generated-image-container');
      const saveArea = document.getElementById('save-area');
      container.innerHTML = '<p class="text-gray-500 font-bold text-xs animate-pulse">A gerar...</p>';
      
      try {
        const canvas = await html2canvas(document.getElementById('tweet-card'), { 
          scale: 3, backgroundColor: "#ffffff", useCORS: true 
        });
        lastImgData = canvas.toDataURL("image/png");
        lastBlob = await (await fetch(lastImgData)).blob();

        container.innerHTML = `<img src="${lastImgData}">`;
        saveArea.classList.remove('hidden');
        document.getElementById('status-msg').innerText = "";
      } catch (err) {
        container.innerHTML = '<p class="text-red-500">Erro ao gerar.</p>';
      }
    }

    async function saveDirect() {
      const msg = document.getElementById('status-msg');
      
      // Tentar o método de partilha primeiro (o melhor para Galeria)
      if (navigator.share && navigator.canShare) {
        const file = new File([lastBlob], "tweet.png", { type: "image/png" });
        if (navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            msg.innerText = "✅ Guardado!";
            return;
          } catch (e) {}
        }
      }

      // Se falhar ou não for suportado, faz o DOWNLOAD direto para evitar o erro
      const link = document.createElement('a');
      link.href = lastImgData;
      link.download = 'tweet.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      msg.innerHTML = "⬇️ Download feito! Se não estiver na galeria,<br>segura na imagem acima e escolhe 'Guardar'.";
    }
  </script>
</body>
      </html>
