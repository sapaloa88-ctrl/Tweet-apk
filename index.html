<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Text Tweet Template - Final Fix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0; padding: 0;
    }
    [contenteditable] {
      outline: none;
      padding: 2px 4px;
      margin: -2px -4px;
      line-height: 1.3;
      display: inline-block;
      min-width: 20px;
    }
    [contenteditable]:focus {
      background-color: rgba(29, 155, 240, 0.08);
      border-radius: 4px;
    }
    .tweet-card-outer {
      background: white;
      width: 100%;
      max-width: 550px;
    }
    .tweet-container {
      padding: 24px;
      background: white;
    }
    .verified-badge {
      color: #1d9bf0;
      display: inline-flex;
      align-items: center;
      margin-left: 4px;
      flex-shrink: 0;
    }
    #generated-image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2);
      border: 1px solid #e5e7eb;
    }
    /* Estilo para o botão de upload sobre a imagem */
    .avatar-wrapper {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .avatar-wrapper:hover .upload-overlay {
      opacity: 1;
    }
    .upload-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .no-export { user-select: none; }
  </style>
</head>
<body class="flex flex-col items-center py-10 px-4">

  <!-- Header Controls -->
  <div class="mb-8 flex flex-wrap justify-center items-center gap-4 no-export">
    <button onclick="toggleVerified()" class="px-5 py-2.5 bg-white border border-gray-200 rounded-full text-sm font-semibold hover:bg-gray-50 transition shadow-sm flex items-center gap-2">
      <span id="verified-toggle-text">Adicionar Selo</span>
      <svg id="toggle-badge-icon" class="w-4 h-4 text-blue-500 hidden" viewBox="0 0 22 22" fill="currentColor"><path d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.44 1.246-.354.54-.551 1.17-.57 1.816.019.646.216 1.275.57 1.816.354.54.852.972 1.438 1.246-.223.607-.27 1.264-.14 1.897.131.634.437-1.218.882 1.687.47.445-1.053.75 1.687.882.633.13 1.29.083 1.897-.14.273.587.704 1.086 1.245 1.44s1.167.554 1.813.57c.646-.017-1.273.213 1.813-.568s.969-.854 1.24-1.439c.608.223 1.267.272 1.902.14.635-.13 1.22-.436 1.69-.882.445-.47.749-1.055.878-1.688.13-.633.08-1.29-.144-1.896.587-.274 1.087-.705 1.44-1.246.354-.54.551-1.17.57-1.816zM9.667 14.857l-3.011-3.011 1.104-1.105 1.907 1.907 4.256-4.256 1.105 1.105-5.361 5.36z"></path></svg>
    </button>
    <button onclick="document.getElementById('avatar-input').click()" class="px-5 py-2.5 bg-black text-white rounded-full text-sm font-bold hover:bg-gray-800 transition shadow-md">
      Escolher Foto de Perfil
    </button>
  </div>

  <!-- The Tweet Card (Export Target) -->
  <div id="tweet-card" class="tweet-card-outer">
    <div class="tweet-container">
      <div class="flex items-start gap-3">
        <!-- Avatar Area -->
        <div class="avatar-wrapper" onclick="document.getElementById('avatar-input').click()">
          <img id="avatar-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e5e7eb'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" 
               class="w-full h-full rounded-full object-cover bg-gray-100" alt="Profile">
          <div class="upload-overlay">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
          <input type="file" id="avatar-input" class="hidden" accept="image/*" onchange="handleImageUpload(event)">
        </div>

        <!-- Content Area -->
        <div class="flex-1 min-w-0" style="padding-top: 2px;">
          <!-- Name Row -->
          <div class="flex items-center mb-0.5">
            <span id="display-name" contenteditable="true" spellcheck="false" class="font-bold text-[15px] text-black">Áurio Byus</span>
            <span id="verified-icon" class="verified-badge hidden">
              <svg viewBox="0 0 22 22" class="w-[18px] h-[18px]" fill="currentColor"><path d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.44 1.246-.354.54-.551 1.17-.57 1.816.019.646.216 1.275.57 1.816.354.54.852.972 1.438 1.246-.223.607-.27 1.264-.14 1.897.131.634.437-1.218.882 1.687.47.445-1.053.75 1.687.882.633.13 1.29.083 1.897-.14.273.587.704 1.086 1.245 1.44s1.167.554 1.813.57c.646-.017-1.273.213 1.813-.568s.969-.854 1.24-1.439c.608.223 1.267.272 1.902.14.635-.13 1.22-.436 1.69-.882.445-.47.749-1.055.878-1.688.13-.633.08-1.29-.144-1.896.587-.274 1.087-.705 1.44-1.246.354-.54.551-1.17.57-1.816zM9.667 14.857l-3.011-3.011 1.104-1.105 1.907 1.907 4.256-4.256 1.105 1.105-5.361 5.36z"></path></svg>
            </span>
          </div>
          <!-- Handle -->
          <div class="text-[#536471] text-[15px] mb-3">
            @<span id="username" contenteditable="true" spellcheck="false">auriobyus</span>
          </div>
          <!-- Tweet Text -->
          <div id="tweet-text" contenteditable="true" spellcheck="false" class="text-black text-[23px] leading-[1.3] break-words">Deus é fiel</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Generate Button -->
  <div class="flex flex-col items-center gap-2 mt-8 no-export">
    <button onclick="generateImage()" class="px-10 py-4 bg-black text-white rounded-full font-bold text-sm hover:bg-gray-800 transition transform active:scale-95 shadow-xl">
      Gerar Imagem para Salvar
    </button>
  </div>

  <!-- Output Container -->
  <div id="generated-image-container" class="mt-12 w-full max-w-[550px] flex flex-col items-center">
    <p id="save-hint" class="text-gray-500 text-xs mb-4 hidden no-export">Pressione e segure a imagem para salvar na galeria</p>
  </div>

  <script>
    let isVerified = false;

    function toggleVerified() {
      isVerified = !isVerified;
      const icon = document.getElementById('verified-icon');
      const toggleIcon = document.getElementById('toggle-badge-icon');
      const toggleText = document.getElementById('verified-toggle-text');
      if (isVerified) {
        icon.classList.remove('hidden');
        toggleIcon.classList.remove('hidden');
        toggleText.innerText = 'Remover Selo';
      } else {
        icon.classList.add('hidden');
        toggleIcon.classList.add('hidden');
        toggleText.innerText = 'Adicionar Selo';
      }
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('avatar-img').src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function generateImage() {
      if (document.activeElement) document.activeElement.blur();
      window.getSelection().removeAllRanges();
      
      const tweetElement = document.getElementById('tweet-card');
      const outputContainer = document.getElementById('generated-image-container');
      const saveHint = document.getElementById('save-hint');

      window.scrollTo(0, 0);

      html2canvas(tweetElement, {
        scale: 3,
        useCORS: true,
        backgroundColor: "#ffffff",
        logging: false
      }).then(canvas => {
        const imgData = canvas.toDataURL("image/png");
        const existingImg = outputContainer.querySelector('img');
        if (existingImg) existingImg.remove();

        const img = document.createElement('img');
        img.src = imgData;
        outputContainer.appendChild(img);
        saveHint.classList.remove('hidden');
        
        setTimeout(() => {
          img.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      });
    }
  </script>
</body>
</html>
